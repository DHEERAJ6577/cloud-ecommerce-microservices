apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-postgres
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-postgres
  template:
    metadata:
      labels:
        app: product-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: productservice
            - name: POSTGRES_PASSWORD
              value: productpassword
            - name: POSTGRES_DB
              value: productdb
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: product-postgres-pvc