apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
  template:
    metadata:
      labels:
        app: order-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: orderservice
            - name: POSTGRES_PASSWORD
              value: orderpassword
            - name: POSTGRES_DB
              value: orderdb
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: order-postgres-pvc