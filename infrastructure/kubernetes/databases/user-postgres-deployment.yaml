apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-postgres
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-postgres
  template:
    metadata:
      labels:
        app: user-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: userservice
            - name: POSTGRES_PASSWORD
              value: userpassword
            - name: POSTGRES_DB
              value: userdb
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: user-postgres-pvc