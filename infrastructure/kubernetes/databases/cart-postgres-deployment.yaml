apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-postgres
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-postgres
  template:
    metadata:
      labels:
        app: cart-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cartservice
            - name: POSTGRES_PASSWORD
              value: cartpassword
            - name: POSTGRES_DB
              value: cartdb
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: cart-postgres-pvc