apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: dheerajj1/ecommerce-order-service:1.0
          ports:
            - containerPort: 8002

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: ORDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: ORDER_DATABASE_URL