apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: dheerajj1/ecommerce-user-service:1.0
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: JWT_SECRET_KEY
            - name: USER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: USER_DATABASE_URL