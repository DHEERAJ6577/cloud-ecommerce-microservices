services:

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      USER_DATABASE_URL: ${USER_DATABASE_URL}
    depends_on:
      user-postgres:
        condition: service_healthy

  user-postgres:
    image: postgres:16
    container_name: user-postgres-compose
    environment:
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userpassword
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ./services/product-service
    container_name: product-service
    ports:
      - "8001:8001"
    environment:
      PRODUCT_DATABASE_URL: ${PRODUCT_DATABASE_URL}
    depends_on:
      product-postgres:
        condition: service_healthy

  product-postgres:
    image: postgres:16
    container_name: product-postgres-compose
    environment:
      POSTGRES_USER: productservice
      POSTGRES_PASSWORD: productpassword
      POSTGRES_DB: productdb
    ports:
      - "5434:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productservice -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-postgres:
    image: postgres:16
    container_name: order-postgres-compose
    environment:
      POSTGRES_USER: orderservice
      POSTGRES_PASSWORD: orderpassword
      POSTGRES_DB: orderdb
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderservice -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8002:8002"
    environment:
      ORDER_DATABASE_URL: ${ORDER_DATABASE_URL}
    depends_on:
      order-postgres:
        condition: service_healthy

  cart-postgres:
    image: postgres:16
    container_name: cart-postgres-compose
    environment:
      POSTGRES_USER: cartservice
      POSTGRES_PASSWORD: cartpassword
      POSTGRES_DB: cartdb
    ports:
      - "5436:5432"
    volumes:
      - cart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartservice -d cartdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  cart-service:
    build:
      context: ./services/cart-service
    container_name: cart-service
    ports:
      - "8003:8003"
    environment:
      CART_DATABASE_URL: ${CART_DATABASE_URL}
    depends_on:
      cart-postgres:
        condition: service_healthy

volumes:
  user_postgres_data:
  product_postgres_data:
  order_postgres_data:
  cart_postgres_data: